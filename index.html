<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="New World">
  <meta name="description" content="A small colonization strategy game for your phone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>New World</title>
</head>
<body>
  <div id="app">
    <canvas id="map" aria-label="Map"></canvas>

    <header id="hud">
      <div class="hud-row">
        <button class="hud-btn" data-act="menu" aria-label="Menu">☰</button>
        <div class="hud-stats">
          <span id="hud-gold">💰 0</span>
          <span id="hud-date">1492</span>
          <span id="hud-lib">🔔 0%</span>
        </div>
        <button class="hud-btn" data-act="units" aria-label="Units">👥<span class="lbl"> Units</span></button>
        <button class="hud-btn" id="hud-europe" data-act="europe" aria-label="Europe">⚓<span class="lbl"> Europe</span></button>
      </div>
      <button id="goal" data-act="goal"></button>
    </header>
    <button id="update" hidden>A new version is ready. Tap to update.</button>

    <div id="toasts" aria-live="polite"></div>
    <footer id="panel"></footer>
    <section id="screen" hidden></section>
    <div id="modal" hidden></div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
